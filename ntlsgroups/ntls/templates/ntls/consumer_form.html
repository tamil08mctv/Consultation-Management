{% load static %}
<form id="consumerForm" method="post" class="needs-validation p-4" novalidate data-aos="fade-up">
    {% csrf_token %}
    <input type="hidden" name="consumer_form" value="1">
    <div class="mb-3">
        <label for="{{ consumer_form.name.id_for_label }}" class="form-label">Name</label>
        {{ consumer_form.name }}
        <div class="invalid-feedback">Please enter your name.</div>
    </div>
    <div class="mb-3">
        <label for="{{ consumer_form.contact.id_for_label }}" class="form-label">Email</label>
        {{ consumer_form.contact }}
        <div class="invalid-feedback">Please enter a valid email address.</div>
    </div>
    <div class="mb-3">
        <label for="{{ consumer_form.services.id_for_label }}" class="form-label">Services Needed</label>
        {{ consumer_form.services }}
        <div class="invalid-feedback">Please describe the services you need.</div>
    </div>
    <div class="text-center mt-4">
        <button type="submit" class="btn btn-custom btn-primary" id="consumerSubmitBtn">Submit</button>
    </div>
</form>
<script>
    (function () {
        'use strict';
        const form = document.getElementById('consumerForm');
        form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
            form.classList.add('was-validated');
        }, false);
    })();
</script>
